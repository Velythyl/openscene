name: Publish OpenScene ragmap image

on:
  push:
    branches: [ragmap]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/velythyl/openscene

jobs:
  docker-amd64:
    runs-on: ubuntu-22.04
    outputs:
      sha_tag: ${{ steps.sha.outputs.tag }}
    steps:
      # The CUDA 12.2 cuDNN image plus TensorFlow and torch is over the stock runner's ~14 GB free.
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/.ghcup /usr/share/swift "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force
          df -h /

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Short SHA tag
        id: sha
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and publish CUDA image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ragmap
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OPENSCENE_GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=openscene-cuda-amd64
          cache-to: type=gha,mode=max,scope=openscene-cuda-amd64,ignore-error=true

      - name: Disk usage after build
        if: always()
        run: df -h /
